name: Visual tests

on:
  pull_request:
  push:
    branches: [main]
  # Manual run: Actions → Visual tests → Run workflow. Enter a PR number to run the
  # full PR flow (tests + agent review + PR comment) without pushing a commit.
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to test and review (leave empty to just run the tests)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: visual-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Playwright + agent review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      # One Eyes batch per run, so the agent reviews exactly this run's results
      APPLITOOLS_BATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      APPLITOOLS_BATCH_NAME: "${{ github.event.pull_request.number && format('PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || inputs.pr && format('PR #{0} (manual run)', inputs.pr) || format('{0} @ {1}', github.ref_name, github.sha) }}"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # PR checkout is a merge commit; HEAD^1 is the base branch
          # Manual run with a PR number: test that PR's merge commit, same as a PR event does
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      # Eyes branching: main → '<repo>/main'; a PR → '<repo>/<pr-branch>' whose parent is '<repo>/main',
      # so every PR is compared against main's baseline.
      - name: Eyes branch for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PR" ]; then
            HEAD="${{ github.head_ref }}"; [ -n "$HEAD" ] || HEAD=$(gh pr view "$PR" -R "${{ github.repository }}" --json headRefName --jq .headRefName)
            echo "EYES_BRANCH_NAME=${{ github.repository }}/$HEAD" >> "$GITHUB_ENV"
            echo "EYES_PARENT_BRANCH_NAME=${{ github.repository }}/${{ github.base_ref || 'main' }}" >> "$GITHUB_ENV"
          else
            echo "EYES_BRANCH_NAME=${{ github.repository }}/${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
          cat "$GITHUB_ENV" | grep EYES_

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the Wikipedia site
        run: |
          node server.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/wikipedia > /dev/null && exit 0
            sleep 1
          done
          echo "Site did not start"; cat server.log; exit 1

      # Eyes differences do not fail Playwright here — the agent below decides.
      - name: Run visual tests
        run: |
          mkdir -p ci-context
          npx playwright test 2>&1 | tee ci-context/eyes-run.log
          exit ${PIPESTATUS[0]}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            ci-context/eyes-run.log
          retention-days: 14

      # ---------- PRs only: Claude reviews the Eyes results through the Applitools MCP ----------

      - name: Collect PR context
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          gh pr view "$PR" --json number,title,author,body \
            --template '# PR #{{.number}}: {{.title}}{{"\n\n"}}Author: {{.author.login}}{{"\n\n"}}## Description{{"\n\n"}}{{.body}}{{"\n"}}' \
            > ci-context/pr.md
          printf '\nTest framework: Playwright (JS)\n' >> ci-context/pr.md
          # Compact diff: only the changed part of each line (pages are minified)
          git diff -U0 HEAD^1 HEAD | node scripts/compact-diff.mjs > ci-context/pr.diff
          # The ticket: from this PR's branch, matched by the ticket ID in the branch name
          BRANCH="${{ github.head_ref }}"; [ -n "$BRANCH" ] || BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          TICKET=$(echo "$BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)
          TASK=$(ls tasks/"$TICKET"-*.md 2>/dev/null | head -1 || true)
          echo "TICKET=$TICKET" >> "$GITHUB_ENV"
          # 1st choice: the ticket from Jira. Fallback: the branch's own snapshot tasks/<KEY>-*.md.
          if [ -n "$TICKET" ] && node scripts/jira.mjs fetch "$TICKET" > ci-context/task.md 2> ci-context/jira.err; then
            TASK="Jira $JIRA_BASE_URL/browse/$TICKET"
          elif [ -n "$TICKET" ] && [ -n "$TASK" ]; then cp "$TASK" ci-context/task.md
          else printf 'No ticket found for branch `%s` (expected a Jira key such as WIKI-123 in the branch name).\n' "$BRANCH" > ci-context/task.md; TASK=""; fi
          cat ci-context/jira.err 2>/dev/null || true
          # Design system + review rules: always from main, so a PR can't change the rules it is judged by
          git fetch -q --depth=1 origin "${{ github.base_ref || 'main' }}"
          git show FETCH_HEAD:guidelines/design-system.md > ci-context/design-system.md
          git show FETCH_HEAD:guidelines/review-rules.md > ci-context/review-rules.md
          CHANGED=$(git diff --name-only HEAD^1 HEAD -- guidelines || true)
          if [ -n "$CHANGED" ]; then
            printf '\n## ⚠️ This PR changes the review guidelines\n\n%s\n\nThese edits were NOT applied: the versions on main were used.\n' "$CHANGED" >> ci-context/pr.md
          fi
          echo "Ticket: ${TICKET:-none} (${TASK:-not found})"
          cat ci-context/pr.md ci-context/pr.diff

      - name: Agent review (Claude + Applitools MCP)
        if: env.PR != ''
        env:
          # Claude auth: an Anthropic API key, or a Claude login token from `claude setup-token`
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Applitools MCP reads results with the read key and accepts/rejects with the write key
          APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
          APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::error::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY   # an empty key would override the token
          for k in APPLITOOLS_READ_KEY APPLITOOLS_WRITE_KEY; do
            [ -n "${!k}" ] || { echo "::error::$k secret is not set"; exit 1; }
          done
          mkdir -p review
          npm install -g @anthropic-ai/claude-code
          # The agent may inspect, accept, reject and add regions in Eyes.
          # It can never save or reset baselines, edit code, or run shell commands.
          claude -p "$(cat ci-context/review-rules.md)" \
            --mcp-config .mcp.json --strict-mcp-config \
            --allowedTools "mcp__applitools-mcp" "Read" "Glob" "Grep" "Write" \
            --disallowedTools "mcp__applitools-mcp__eyes_resolve_save" "mcp__applitools-mcp__eyes_resolve_reset" "Bash" "Edit" \
            --max-turns 150 \
            --output-format stream-json --verbose \
            | tee review/agent-transcript.jsonl | node scripts/agent-progress.mjs

      - name: Upload agent transcript
        if: always() && env.PR != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-review
          path: review/
          retention-days: 14

      - name: Comment on the PR
        if: always() && env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f review/summary.md ]; then
            {
              echo '> 🤖 **Posted by Claude, the AI visual reviewer** — runs in CI with the Applitools MCP. It reviews every Eyes difference, accepts or rejects steps, and passes or fails this check. It **never saves baselines**: the 👤 items below are for people.'
              echo
              cat review/summary.md
              echo
              echo '---'
              echo '📏 **Decided using [the guidelines](https://github.com/ssharma007-dev/wikipedia-visual-ci/tree/main/guidelines)** (from main): not asked for by the ticket → reject · asked for but breaks the [design system](https://github.com/ssharma007-dev/wikipedia-visual-ci/blob/main/guidelines/design-system.md) → reject, a person decides · asked for and on-design → accept · shift of **2px or less** with no HTML change → noise · unsure → left for a person.'
            } > review/comment.md
            gh pr comment "$PR" --body-file review/comment.md
          else
            gh pr comment "$PR" --body "## ⚠️ Visual review did not complete
          The agent did not produce a summary. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi

      - name: Comment on the Jira ticket
        if: always() && env.PR != '' && env.TICKET != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          [ -f review/verdict.json ] || { echo "No verdict to post"; exit 0; }
          BATCH=$(grep -oE 'https://eyes\.applitools\.com/app/(test-results|batches)/[0-9]+[^)]*' review/summary.md 2>/dev/null | grep -vE '/[0-9]+/[0-9]+' | tail -1 || true)
          node scripts/jira.mjs comment "$TICKET" review/verdict.json \
            "${{ github.server_url }}/${{ github.repository }}/pull/$PR" "$BATCH" \
            || echo "::warning::Could not comment on Jira ticket $TICKET (Jira not configured or not reachable)"

      - name: Enforce verdict
        if: env.PR != ''
        run: |
          verdict=$(node -p 'require("./review/verdict.json").verdict' 2>/dev/null || echo missing)
          echo "Agent verdict: $verdict"
          cat review/verdict.json 2>/dev/null || true
          [ "$verdict" = "pass" ] || { echo "::error::Visual review verdict: $verdict"; exit 1; }
