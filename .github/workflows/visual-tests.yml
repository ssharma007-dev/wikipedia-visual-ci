name: Visual tests

on:
  pull_request:
  push:
    branches: [main]
  # Manual run: Actions → Visual tests → Run workflow. Enter a PR number to run the
  # full PR flow (tests + agent review + PR comment) without pushing a commit.
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to test and review (leave empty to just run the tests)'
        required: false
        type: string

permissions:
  contents: write   # automatic review merges passing PRs
  pull-requests: write
  statuses: write   # posts the "Visual review" result on the PR (a required check on main)

concurrency:
  group: visual-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  # PR runs: a newer push replaces the older run. Runs on main are never cancelled — each one saves main's baseline.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR that only changes docs or the pipeline ( vars.NO_TICKET_PATHS ) has nothing to test visually:
  # the Visual review check passes straight away and the tests are skipped.
  scope:
    name: What the PR changes
    if: ${{ !(github.event_name == 'pull_request' && endsWith(github.event.pull_request.user.login, '[bot]') && endsWith(github.event.sender.login, '[bot]')) }}
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.s.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: visual-agent/scripts
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          NO_TICKET_PATHS: ${{ vars.NO_TICKET_PATHS }}
        run: |
          if [ -n "$PR" ] && [ "$(bash visual-agent/scripts/pr-scope.sh "$PR")" = no-app ]; then
            echo "app=no" >> "$GITHUB_OUTPUT"
            SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
            gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context="Visual review" \
              -f description="No app change: docs or pipeline only" >/dev/null
            echo "Docs / pipeline only: visual review not needed" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "app=yes" >> "$GITHUB_OUTPUT"
          fi

  visual:
    needs: scope
    outputs:
      merged: ${{ steps.auto.outputs.merged }}
      via_app: ${{ steps.auto.outputs.via_app }}
    name: Playwright + agent review
    # PRs opened by Agent 1 (as the app eyes-mcp-visual-agent) were already tested and reviewed in Agent 1's own
    # run — skip a second, identical review. A skipped job counts as passed for required checks.
    # Later pushes to such a PR (e.g. a person fixing a bug) are reviewed normally.
    # Skip only pushes made by the bot itself (sender ends in [bot]); a person pushing a fix is reviewed normally.
    if: ${{ needs.scope.outputs.app == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SITE_URL: ${{ vars.APP_URL || 'http://localhost:3001/wikipedia' }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      # One Eyes batch per run, so the agent reviews exactly this run's results
      APPLITOOLS_BATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      APPLITOOLS_BATCH_NAME: "${{ github.event.pull_request.number && format('PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || inputs.pr && format('PR #{0} (manual run)', inputs.pr) || format('{0} @ {1}', github.ref_name, github.sha) }}"

    steps:
      - name: Note the start time ( for the report )
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Merges are made as the app "Eyes MCP Visual Agent", so they trigger the after-merge run on main.
      - name: Get the agent's GitHub App token
        id: app
        if: vars.BOT_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # PR checkout is a merge commit; HEAD^1 is the base branch
          # Manual run with a PR number: test that PR's merge commit, same as a PR event does
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      # Eyes branching: main → '<repo>/main'; a PR → '<repo>/<pr-branch>' whose parent is '<repo>/main',
      # so every PR is compared against main's baseline.
      - name: Eyes branch for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PR" ]; then
            HEAD="${{ github.head_ref }}"; [ -n "$HEAD" ] || HEAD=$(gh pr view "$PR" -R "${{ github.repository }}" --json headRefName --jq .headRefName)
            echo "EYES_BRANCH_NAME=${{ github.repository }}/$HEAD" >> "$GITHUB_ENV"
            echo "EYES_PARENT_BRANCH_NAME=${{ github.repository }}/${{ github.base_ref || 'main' }}" >> "$GITHUB_ENV"
          else
            echo "EYES_BRANCH_NAME=${{ github.repository }}/${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
          cat "$GITHUB_ENV" | grep EYES_

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the app (vars.APP_START_COMMAND, waits for vars.APP_URL)
        run: |
          ${{ vars.APP_START_COMMAND || 'npm start' }} > server.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf "${{ vars.APP_URL || 'http://localhost:3001/wikipedia' }}" > /dev/null && exit 0
            sleep 1
          done
          echo "Site did not start"; cat server.log; exit 1

      # Devices: the Jira ticket's "Test on below devices:" list ( ticket found by the key in the branch name ),
      # otherwise the defaults in playwright.config.ts.
      - name: Devices from the Jira ticket
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          BRANCH="${{ github.head_ref }}"; [ -n "$BRANCH" ] || BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          KEY=$(echo "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
          [ -n "$KEY" ] || { echo "No ticket key: default devices"; exit 0; }
          node visual-agent/scripts/jira.mjs fetch "$KEY" > /tmp/ticket.md 2>/dev/null || cp tasks/"$KEY"-*.md /tmp/ticket.md 2>/dev/null || { echo "Ticket not readable: default devices"; exit 0; }
          DEV=$(node visual-agent/scripts/devices.mjs /tmp/ticket.md || true)
          if [ -n "$DEV" ]; then echo "EYES_DEVICES=$DEV" >> "$GITHUB_ENV"; echo "Devices from $KEY: $DEV"
          else echo "Devices: playwright.config.ts defaults"; fi

      # Eyes differences do not fail Playwright here — the agent below decides.
      # A failed functional check (expect) does not stop the pipeline either: the AI review, the PDF and the
      # Jira comment still run, and the last step fails the build so the PR can't merge.
      - name: Run the tests (functional and visual)
        run: |
          mkdir -p ci-context
          npx playwright test 2>&1 | tee ci-context/eyes-run.log
          CODE=${PIPESTATUS[0]}
          node visual-agent/scripts/failed-tests.mjs test-results/results.json ci-context/failed-tests.json ci-context/failed-tests.md ci-context/test-stats.json
          if [ "$CODE" != 0 ]; then
            echo "TESTS_FAILED=yes" >> "$GITHUB_ENV"
            echo "::error::Functional checks failed — the review continues, but this PR can't merge until they pass."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            ci-context/eyes-run.log
          retention-days: 14

      # ---------- PRs only: Claude reviews the Eyes results through the Applitools MCP ----------

      - name: Collect PR context
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          gh pr view "$PR" --json number,title,author,body \
            --template '# PR #{{.number}}: {{.title}}{{"\n\n"}}Author: {{.author.login}}{{"\n\n"}}## Description{{"\n\n"}}{{.body}}{{"\n"}}' \
            > ci-context/pr.md
          printf '\nTest framework: Playwright (JS)\n' >> ci-context/pr.md
          # Compact diff: only the changed part of each line (pages are minified)
          git diff -U0 HEAD^1 HEAD | node visual-agent/scripts/compact-diff.mjs > ci-context/pr.diff
          # The ticket: from this PR's branch, matched by the ticket ID in the branch name
          BRANCH="${{ github.head_ref }}"; [ -n "$BRANCH" ] || BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          TICKET=$(echo "$BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)
          TASK=$(ls tasks/"$TICKET"-*.md 2>/dev/null | head -1 || true)
          echo "TICKET=$TICKET" >> "$GITHUB_ENV"
          # 1st choice: the ticket from Jira. Fallback: the branch's own snapshot tasks/<KEY>-*.md.
          if [ -n "$TICKET" ] && node visual-agent/scripts/jira.mjs fetch "$TICKET" > ci-context/task.md 2> ci-context/jira.err; then
            TASK="Jira $JIRA_BASE_URL/browse/$TICKET"
          elif [ -n "$TICKET" ] && [ -n "$TASK" ]; then cp "$TASK" ci-context/task.md
          else printf 'No ticket found for branch `%s` (expected a Jira key such as WIKI-123 in the branch name).\n' "$BRANCH" > ci-context/task.md; TASK=""
            echo "NO_TICKET=yes" >> "$GITHUB_ENV"; fi
          cat ci-context/jira.err 2>/dev/null || true
          # Design system + review rules: always from main, so a PR can't change the rules it is judged by
          git fetch -q --depth=1 origin "${{ github.base_ref || 'main' }}"
          git show FETCH_HEAD:visual-agent/guidelines/design-system.md > ci-context/design-system.md
          git show FETCH_HEAD:visual-agent/guidelines/review-rules.md > ci-context/review-rules.md
          CHANGED=$(git diff --name-only HEAD^1 HEAD -- visual-agent/guidelines || true)
          if [ -n "$CHANGED" ]; then
            printf '\n## ⚠️ This PR changes the review guidelines\n\n%s\n\nThese edits were NOT applied: the versions on main were used.\n' "$CHANGED" >> ci-context/pr.md
          fi
          # Failed functional checks: the AI must mention them, and the verdict can't be pass
          if [ -s ci-context/failed-tests.md ]; then printf '\n' >> ci-context/pr.md; cat ci-context/failed-tests.md >> ci-context/pr.md; fi
          echo "Ticket: ${TICKET:-none} (${TASK:-not found})"
          cat ci-context/pr.md ci-context/pr.diff

      # No ticket → nothing to judge against: skip the AI review (the Ticket check explains how to fix it).
      - name: Agent review (Claude + Applitools MCP)
        if: env.PR != '' && env.NO_TICKET != 'yes'
        env:
          # Claude auth: an Anthropic API key, or a Claude login token from `claude setup-token`
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Applitools MCP reads results with the read key and accepts/rejects with the write key
          APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
          APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::error::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY   # an empty key would override the token
          for k in APPLITOOLS_READ_KEY APPLITOOLS_WRITE_KEY; do
            [ -n "${!k}" ] || { echo "::error::$k secret is not set"; exit 1; }
          done
          mkdir -p review
          npm install -g @anthropic-ai/claude-code
          # The agent may inspect, accept, reject and add regions in Eyes.
          # It can never save or reset baselines, edit code, or run shell commands.
          claude -p "$(cat ci-context/review-rules.md)" \
            --mcp-config visual-agent/mcp.json --strict-mcp-config \
            --allowedTools "mcp__applitools-mcp" "Read" "Glob" "Grep" "Write" \
            --disallowedTools "mcp__applitools-mcp__eyes_resolve_save" "mcp__applitools-mcp__eyes_resolve_reset" "Bash" "Edit" \
            --max-turns 150 \
            --output-format stream-json --verbose \
            | tee review/agent-transcript.jsonl | node visual-agent/scripts/agent-progress.mjs

      # Before / after / differences images for the PDF — must run before any save.
      - name: Collect visual evidence from Eyes
        if: env.PR != '' && env.NO_TICKET != 'yes'
        env:
          APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
          APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
        run: |
          B=$(grep -m1 -oE 'https://eyes\.applitools\.com/app/test-results/[0-9]+\?accountId=[A-Za-z0-9_]+' ci-context/eyes-run.log || true)
          [ -n "$B" ] || { echo "No Eyes batch found — skipping evidence"; exit 0; }
          node visual-agent/scripts/eyes-evidence.mjs "$B" review/evidence || true

      - name: Comment on the PR
        if: always() && env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f review/summary.md ]; then
            {
              echo '> 🤖 **Posted by Claude, the AI visual reviewer** — runs in CI with the Applitools MCP. It reviews every Eyes difference, accepts or rejects steps, and passes or fails this check. It **never saves baselines**: the 👤 items below are for people.'
              echo
              cat review/summary.md
              echo
              [ -s ci-context/failed-tests.md ] && { cat ci-context/failed-tests.md; echo; }
              echo '---'
              echo '📏 **Decided using [the guidelines](${{ github.server_url }}/${{ github.repository }}/tree/main/visual-agent/guidelines)** (from main): not asked for by the ticket → reject · asked for but breaks the [design system](${{ github.server_url }}/${{ github.repository }}/blob/main/visual-agent/guidelines/design-system.md) → reject, a person decides · asked for and on-design → accept · shift of **2px or less** with no HTML change → noise · unsure → left for a person.'
            } > review/comment.md
            gh pr comment "$PR" --body-file review/comment.md
          elif [ "$NO_TICKET" = yes ]; then
            gh pr comment "$PR" --body "## ⏭️ AI visual review skipped: no Jira ticket
          Without a ticket the AI has nothing to compare the changes against. See the **Ticket check** comment for how to fix the branch name.$( [ -s ci-context/failed-tests.md ] && printf '\n\n%s' "$(cat ci-context/failed-tests.md)" )"
          elif grep -qi "session limit\|usage limit\|rate limit\|weekly limit\|hit your .* limit" review/agent-transcript.jsonl 2>/dev/null; then
            gh pr comment "$PR" --body "## ⏸️ AI visual review paused: Claude usage limit reached
          Nothing is wrong with the change itself. Re-run this check later (Actions → this run → Re-run jobs)."
          else
            gh pr comment "$PR" --body "## ⚠️ Visual review did not complete
          The agent did not produce a summary. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi

      # The result as a PR check called "Visual review", required on main: a PR can't be merged by hand while
      # the review failed, functional checks failed, or there is no ticket.
      - name: Report the review result on the PR
        if: always() && env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"; [ -n "$SHA" ] || SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          V=$(node -p 'require("./review/verdict.json").verdict' 2>/dev/null || echo missing)
          if [ "$NO_TICKET" = yes ]; then STATE=failure; DESC="No Jira ticket for this branch"
          elif [ "$TESTS_FAILED" = yes ]; then STATE=failure; DESC="Functional checks failed"
          elif [ "$V" = pass ]; then STATE=success; DESC="AI visual review passed"
          else STATE=failure; DESC="AI visual review: $V — see the PR comment and PDF"; fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state="$STATE" -f context="Visual review" \
            -f description="$DESC" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          echo "Visual review → $STATE ($DESC)"

      # Automatic review (default): a passing PR is saved and merged by the pipeline, unless a person asked
      # to review it (label human-review on the Jira ticket or on the PR). Anything else stays with a person.
      - name: "Automatic review: save baselines and merge"
        id: auto
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          MERGE_POLICY: ${{ vars.MERGE_POLICY || 'code-approval' }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
          APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
        run: |
          [ "$TESTS_FAILED" != yes ] || { echo "Functional checks failed — not merging."; exit 0; }
          V=$(node -p 'require("./review/verdict.json").verdict' 2>/dev/null || echo missing)
          [ "$V" = "pass" ] || { echo "Verdict $V — a person decides."; exit 0; }
          LABELS="$(gh pr view "$PR" --json labels --jq '[.labels[].name]|join(",")'),$( [ -n "$TICKET" ] && node visual-agent/scripts/jira.mjs labels "$TICKET" 2>/dev/null )"
          if echo ",$LABELS," | grep -q ',human-review,'; then echo "human-review requested — a person saves and merges."; exit 0; fi
          # Label auto-ai-merge ( on the Jira ticket or the PR ) → the pipeline merges by itself; otherwise a person approves first.
          if echo ",$LABELS," | grep -q ',auto-ai-merge,'; then MERGE_POLICY=auto; fi
          echo "EFFECTIVE_POLICY=$MERGE_POLICY" >> "$GITHUB_ENV"
          AUTHOR=$(gh pr view "$PR" --json author --jq .author.login)
          case "$AUTHOR" in app/*|github-actions*|*\[bot\]) echo "Agent-opened PR — Agent 1 handles it."; exit 0 ;; esac
          B=$(grep -m1 -oE 'https://eyes\.applitools\.com/app/test-results/[0-9]+\?accountId=[A-Za-z0-9_]+' ci-context/eyes-run.log || true)
          [ -n "$B" ] || { echo "No Eyes batch found — a person decides."; exit 0; }
          node visual-agent/scripts/eyes-save.mjs "$B" || { echo "Eyes guard refused to save — a person decides."; exit 0; }
          echo "saved=yes" >> "$GITHUB_OUTPUT"
          # Merge policy: code-approval ( default ) waits for one person to approve the code; label auto-ai-merge merges now.
          # code-approval: wait for one
          # person to approve the code, then GitHub merges by itself (auto-merge).
          if [ "$MERGE_POLICY" = "code-approval" ]; then
            gh pr merge "$PR" --auto --squash --delete-branch --body "Merged by the pipeline after the AI visual review passed." || true
            gh pr comment "$PR" --body "🤖 **Visual review passed** and the baselines were saved on this branch. Waiting for **one code approval** — once a reviewer approves, GitHub merges this PR automatically."
            echo "waiting=code-approval" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main needs one approval. The bot may skip it ( ruleset bypass ), but GitHub only applies that with --admin,
          # so --admin is used only when every required check ( Jira ticket, Visual review ) has passed.
          ADMIN=""; if gh pr checks "$PR" --required > checks.txt 2>&1; then ADMIN="--admin"; fi; cat checks.txt
          if gh pr merge "$PR" $ADMIN --squash --delete-branch --body "Merged by the pipeline after the AI visual review passed."; then
            echo "merged=yes" >> "$GITHUB_OUTPUT"
            [ -n "${{ steps.app.outputs.token }}" ] && echo "via_app=yes" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --body "🤖 **Automatic review:** no bugs and nothing unresolved, so the baselines were saved in Eyes and this PR was merged. Add the label \`human-review\` to the Jira ticket or the PR to keep a person in the loop next time."
            [ -n "$TICKET" ] && node visual-agent/scripts/jira.mjs transition "$TICKET" "${{ vars.JIRA_STATUS_DONE || 'Done' }}" || true
          else
            echo "::warning::Merge failed (e.g. a conflict) — a person merges."
          fi

      - name: Render the PDF report
        if: always() && env.PR != ''
        run: |
          [ -f review/report.json ] || { echo "::warning::The AI review did not write review/report.json — no PDF"; exit 0; }
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Test links point at the exact commit, so they keep working after the branch is merged and deleted.
          export REPORT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          export MERGE_POLICY="${EFFECTIVE_POLICY:-${{ vars.MERGE_POLICY || 'code-approval' }}}" JIRA_BASE_URL="${{ secrets.JIRA_BASE_URL }}"
          export PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/$PR"
          if [ "${{ steps.auto.outputs.saved }}" = "yes" ]; then
            node -e 'const f="./review/report.json",r=require(f);r.baseline=r.baseline||{};r.baseline.saved=true;r.baseline.note="Automatic review (default): no bugs and nothing unresolved, so the pipeline saved the baselines.";r.summary=r.summary||{};r.summary.nextSteps=["No action needed: the pipeline saved the baselines and merged the PR. Add the label human-review to the Jira ticket or the PR to keep a person in the loop next time."];require("fs").writeFileSync(f,JSON.stringify(r,null,2))'
          fi
          node -e 'const f="./review/report.json",r=require(f);try{r.failedTests=JSON.parse(require("fs").readFileSync("ci-context/failed-tests.json"))}catch{};r.source="pr-review";r.task=r.task||{};r.task.key=r.task.key||process.env.TICKET||"PR-"+process.env.PR;require("fs").writeFileSync(f,JSON.stringify(r,null,2))'
          cp ci-context/test-stats.json review/test-stats.json 2>/dev/null || true
          node visual-agent/scripts/render-report.mjs review/report.json review/report.html review/report-summary.md "$RUN_URL"
          NAME="${TICKET:-PR-$PR}-visual-report.pdf"
          node visual-agent/scripts/report-pdf.mjs review/report.html "review/$NAME" || echo "::warning::PDF could not be created"

      - name: "Jira: attach the PDF and comment"
        if: always() && env.PR != '' && env.TICKET != '' && env.NO_TICKET != 'yes'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          [ -f review/verdict.json ] || { echo "No verdict to post"; exit 0; }
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/$PR"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          B=$(grep -m1 -oE 'https://eyes\.applitools\.com/app/test-results/[0-9]+\?accountId=[A-Za-z0-9_]+' ci-context/eyes-run.log || true)
          PDF="review/$TICKET-visual-report.pdf"; PDF_URL=""
          # Attach the PDF first, so the comment can link straight to it
          if [ -f "$PDF" ]; then
            node visual-agent/scripts/jira.mjs attach "$TICKET" "$PDF" > ci-context/attach.out 2>&1 || true
            cat ci-context/attach.out
            PDF_URL=$(sed -n 's/^ATTACHMENT_URL=//p' ci-context/attach.out)
            [ -n "$PDF_URL" ] || echo "::warning::The PDF was NOT attached to $TICKET — see the error above. It is in this run's artifacts."
            # The PR gets the PDF link too, so reviewers on GitHub find the report without going to Jira.
            if [ -n "$PDF_URL" ] && [ -n "$PR" ]; then
              GH_TOKEN="${GH_TOKEN:-${{ github.token }}}" gh pr comment "$PR" -R "${{ github.repository }}" \
                --body "📄 **PDF report:** [$(basename "$PDF")]($PDF_URL) — attached to Jira [$TICKET](${JIRA_BASE_URL%/}/browse/$TICKET): summary, every visual change with before / after / difference images, and each bug with why it is a bug and how to fix it." || true
            fi
          else
            echo "::warning::No PDF was produced for $TICKET."
          fi
          V=$(node -p 'require("./review/report.json").verdict' 2>/dev/null || node -p 'require("./review/verdict.json").verdict')
          S=$(node -p 'require("./review/verdict.json").summary' 2>/dev/null || echo "")
          {
            echo "🤖 AI visual review of PR #$PR — verdict: $V"
            [ -n "$PDF_URL" ] && echo "📄 PDF report (summary, bugs with evidence and fixes, before/after images): [$TICKET-visual-report.pdf]($PDF_URL)"
            [ -n "$S" ] && echo "Summary: $S"
            [ "$TESTS_FAILED" = yes ] && echo "❌ Functional checks failed: $(node -p 'require("./ci-context/failed-tests.json").map(t=>t.name).join("; ")' 2>/dev/null) — the PR can't merge until they pass."
            echo "Pull request: [$PR_URL]($PR_URL)"
            [ -n "$B" ] && echo "Eyes batch: [open in Eyes]($B)"
            echo "CI run: [$RUN]($RUN)"
            if [ "${{ steps.auto.outputs.merged }}" = "yes" ]; then echo "Automatic review: baselines saved and PR merged — ticket moved to Done."
            else echo "👤 A person decides: review the PDF, then fix or approve, save the baselines in Eyes and merge."; fi
          } > review/jira-note.txt
          node visual-agent/scripts/jira.mjs note "$TICKET" review/jira-note.txt \
            || echo "::warning::Could not comment on Jira ticket $TICKET (Jira not configured or not reachable)"

      - name: Upload the review and report
        if: always() && env.PR != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-review
          path: review/
          retention-days: 30

      # Tell people when a decision is waiting: label the PR, and label + assign the Jira ticket to its reporter.
      - name: "Flag for a person when needed"
        if: always() && env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ "${{ steps.auto.outputs.merged }}" = yes ]; then
            [ -n "$TICKET" ] && [ "$NO_TICKET" != yes ] && node visual-agent/scripts/jira.mjs needs-human "$TICKET" off || true
            exit 0
          fi
          gh label create needs-human --color D93F0B --description "Waiting for a person to decide" --force >/dev/null 2>&1 || true
          gh pr edit "$PR" --add-label needs-human || true
          if [ -n "$TICKET" ] && [ "$NO_TICKET" != yes ]; then
            node visual-agent/scripts/jira.mjs transition "$TICKET" "${{ vars.JIRA_STATUS_IN_REVIEW || 'In Review|Review' }}" || true
            node visual-agent/scripts/jira.mjs needs-human "$TICKET" on || true
          fi

      - name: Enforce verdict
        if: env.PR != ''
        run: |
          verdict=$(node -p 'require("./review/verdict.json").verdict' 2>/dev/null || echo missing)
          echo "Agent verdict: $verdict"
          cat review/verdict.json 2>/dev/null || true
          [ "$NO_TICKET" != yes ] || { echo "::error::No Jira ticket for this branch — see the Ticket check"; exit 1; }
          [ "$verdict" = "pass" ] || { echo "::error::Visual review verdict: $verdict"; exit 1; }

      - name: Functional checks must pass
        if: always() && env.TESTS_FAILED == 'yes'
        run: |
          cat ci-context/failed-tests.md 2>/dev/null || true
          echo "::error::Functional checks failed"; exit 1

      # ---------- main only: every merged PR updates main's baseline and closes its ticket ----------
      # A PR reaches main only after its review (automatic or a person's), so what is on main is approved:
      # accept this run's differences and save, so main's baseline always matches main's code.
      - name: "After a merge: update main's baseline and close the ticket"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
          APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          PRJSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)][0] // empty')
          [ -n "$PRJSON" ] || { echo "Not a merged pull request — main's baseline is left as is."; exit 0; }
          NUM=$(echo "$PRJSON" | node -pe 'JSON.parse(require("fs").readFileSync(0)).number')
          HEADREF=$(echo "$PRJSON" | node -pe 'JSON.parse(require("fs").readFileSync(0)).head.ref')
          echo "Merged PR #$NUM ($HEADREF)"
          B=$(grep -m1 -oE 'https://eyes\.applitools\.com/app/test-results/[0-9]+\?accountId=[A-Za-z0-9_]+' ci-context/eyes-run.log || true)
          if [ -n "$B" ]; then node visual-agent/scripts/eyes-save.mjs "$B" --accept-all || echo "::warning::Could not save main's baseline"; fi
          KEY=$(echo "$HEADREF" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
          if [ -n "$KEY" ]; then
            node visual-agent/scripts/jira.mjs transition "$KEY" "${{ vars.JIRA_STATUS_DONE || 'Done' }}" || true
            node visual-agent/scripts/jira.mjs needs-human "$KEY" off || true
          fi

  # Fallback when the GitHub App isn't configured: merges made with the default token don't trigger the
  # after-merge run on main, so refresh main's Eyes baseline here instead.
  main-baseline:
    name: "Automatic review: refresh main's baseline"
    needs: visual
    if: needs.visual.outputs.merged == 'yes' && needs.visual.outputs.via_app != 'yes'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: main-baseline
      cancel-in-progress: false
    env:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
      APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
      APPLITOOLS_BATCH_ID: main-baseline-${{ github.run_id }}-${{ github.run_attempt }}
      APPLITOOLS_BATCH_NAME: "main · baseline after PR #${{ github.event.pull_request.number }} (automatic)"
      EYES_BRANCH_NAME: ${{ github.repository }}/main
      SITE_URL: ${{ vars.APP_URL || 'http://localhost:3001/wikipedia' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Keep main free of task snapshots
        run: |
          [ -d tasks ] || exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq tasks && git commit -m "[agent] Remove merged task snapshots from main [skip ci]" && git push origin HEAD:main
      - name: Install and start the site
        run: |
          npm ci && npx playwright install --with-deps chromium
          ${{ vars.APP_START_COMMAND || 'npm start' }} > server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf "${{ vars.APP_URL || 'http://localhost:3001/wikipedia' }}" > /dev/null && break; sleep 1; done
      - name: Run the visual tests on merged main
        run: npx playwright test 2>&1 | tee main-run.log
      - name: Accept and save (the merged change was approved by the automatic review)
        run: |
          B=$(grep -m1 -oE 'https://eyes\.applitools\.com/app/test-results/[0-9]+\?accountId=[A-Za-z0-9_]+' main-run.log)
          node visual-agent/scripts/eyes-save.mjs "$B" --accept-all
