name: Jira ticket (create or inspect)

# Create a Jira ticket, or check what the pipeline posted on one (status, attachments, comments),
# using the pipeline's Jira credentials. Actions → "Jira ticket" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'create or inspect'
        type: choice
        options: [inspect, create]
      key:
        description: 'inspect: the ticket key (e.g. WIKI-8) · create: the project key (e.g. WIKI)'
        required: true
      summary:
        description: 'create: ticket summary'
        required: false
      description:
        description: 'create: description (markdown; use \n for new lines)'
        required: false
      labels:
        description: 'create: labels, comma separated'
        required: false

permissions:
  contents: read

jobs:
  jira:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          KEY: ${{ inputs.key }}
          SUMMARY: ${{ inputs.summary }}
          DESCRIPTION: ${{ inputs.description }}
          LABELS: ${{ inputs.labels }}
        run: |
          if [ "$ACTION" = create ]; then
            printf '%b\n' "$DESCRIPTION" > desc.md
            NEW=$(node scripts/jira.mjs create "${KEY%%-*}-0" "$SUMMARY" desc.md "$LABELS")
            echo "Created $NEW: ${JIRA_BASE_URL%/}/browse/$NEW" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/jira.mjs inspect "$KEY" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
